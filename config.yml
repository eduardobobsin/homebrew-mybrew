# mybrew instance configuration. Not read by anything yet; the workflow takes
# its storage settings from the MYBREW_* repository variables.
engine:
  repository: eduardobobsin/mybrew
  ref: main

platform:
  runner: macos-15-intel
  bottle_tag: sequoia

storage:
  provider: s3
  bucket: mybrew-bottles
  region: us-east-1
  root_url: https://mybrew-bottles.s3.us-east-1.amazonaws.com/bottles/sequoia
