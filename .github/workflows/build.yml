name: Build bottle

on:
  workflow_dispatch:
    inputs:
      formula:
        description: homebrew/core formula to bottle for Intel Sequoia
        required: true

permissions:
  contents: read

concurrency:
  group: tap-writes
  cancel-in-progress: false

env:
  ROOT_URL: ${{ vars.MYBREW_ROOT_URL }}

jobs:
  # Runs untrusted upstream build code, so it gets a read-only token that is
  # never written to disk.
  build:
    runs-on: macos-15-intel
    timeout-minutes: 240
    outputs:
      formulae: ${{ steps.plan.outputs.formulae }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - id: plan
        uses: eduardobobsin/mybrew/actions/plan@main
        with:
          formula: ${{ inputs.formula }}

      - name: Nothing to build
        if: steps.plan.outputs.formulae == ''
        env:
          FORMULA: ${{ inputs.formula }}
        run: echo "::notice::$FORMULA and its dependencies already have Intel bottles (official or mybrew)."

      - name: Update Homebrew
        if: steps.plan.outputs.formulae != ''
        run: brew update

      - if: steps.plan.outputs.formulae != ''
        uses: eduardobobsin/mybrew/actions/import-formula@main
        with:
          formulae: ${{ steps.plan.outputs.formulae }}

      - id: build
        if: steps.plan.outputs.formulae != ''
        uses: eduardobobsin/mybrew/actions/build-bottle@main
        with:
          formulae: ${{ steps.plan.outputs.formulae }}
          root-url: ${{ env.ROOT_URL }}

      - name: Stage formulae with bottle blocks
        if: steps.plan.outputs.formulae != ''
        env:
          FORMULAE: ${{ steps.plan.outputs.formulae }}
          OUTPUT_DIR: ${{ steps.build.outputs.output-dir }}
        run: for f in $FORMULAE; do cp "Formula/$f.rb" "$OUTPUT_DIR/"; done

      - if: steps.plan.outputs.formulae != ''
        uses: actions/upload-artifact@v4
        with:
          name: bottles
          path: ${{ steps.build.outputs.output-dir }}

  # Only this job can write to the tap or get AWS credentials, and it runs no
  # formula code.
  publish:
    needs: build
    if: needs.build.outputs.formulae != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: bottles
          path: ${{ runner.temp }}/bottles

      - uses: eduardobobsin/mybrew/actions/publish-s3@main
        with:
          formula: ${{ inputs.formula }}
          bottle-dir: ${{ runner.temp }}/bottles
          bucket: ${{ vars.MYBREW_S3_BUCKET }}
          region: ${{ vars.MYBREW_AWS_REGION }}
          role-arn: ${{ vars.MYBREW_AWS_ROLE_ARN }}
          root-url: ${{ env.ROOT_URL }}

  # A clean machine must install everything from the published tap without
  # compiling anything.
  verify:
    needs: publish
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bottles
          path: ${{ runner.temp }}/bottles

      - uses: eduardobobsin/mybrew/actions/verify-install@main
        with:
          plan-file: ${{ runner.temp }}/bottles/plan.json
